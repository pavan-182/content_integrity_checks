services:
  - type: web
    name: asco-content-integrity
    runtime: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd frontend && python server.py
    envVars:
      - key: ASCO_PIPELINE_INPUT
        value: /opt/render/project/src
      - key: PORT
        value: 8000
    routes:
      - path: /
        destination: /
