name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compilation and correctness lint
        run: |
          python -m compileall -q content_integrity scripts tests frontend
          python -m ruff check content_integrity scripts tests frontend

      - name: Unit tests
        run: python -m pytest tests/ -q

      # Detection regression gate: run_eval.py exits non-zero on any precision/recall
      # loss, wrongly merged or split family, or finding-count mismatch.
      - name: Detection regression
        run: python scripts/run_eval.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend clean install, tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
