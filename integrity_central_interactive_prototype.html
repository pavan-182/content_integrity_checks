<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Integrity Central — Editor Triage Prototype</title>
  <style>
    :root{
      --viz-panel:#f7f8fa;
      --viz-card:#ffffff;
      --viz-chip-card:#ffffff;
      --viz-text:#172033;
      --viz-muted:#667085;
      --viz-border:#dfe3ea;
      --viz-accent:#2563eb;
      --viz-accent-text:#ffffff;
      --viz-accent-bg:#eaf2ff;
      --viz-accent-bg-subtle:#f4f7ff;
      --viz-series-1:#2563eb;
    }
    *{box-sizing:border-box}
    body{margin:0;background:#eef1f5}
    .integrity-app{color-scheme:light;--high-bg:#fff1f2;--high-text:#b42335;--high-border:#fecdd3;--mod-bg:#fff7ed;--mod-text:#b45309;--mod-border:#fed7aa;--low-bg:#f0fdf4;--low-text:#15803d;--low-border:#bbf7d0;--info-bg:#eff6ff;--info-text:#1d4ed8;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--viz-text);max-width:1500px;margin:24px auto;background:var(--viz-panel)}
    .integrity-shell{display:grid;grid-template-columns:178px minmax(0,1fr);border:1px solid var(--viz-border);border-radius:12px;overflow:hidden;background:var(--viz-panel);min-height:820px}
    .integrity-sidebar{border-right:1px solid var(--viz-border);background:var(--viz-card);padding:14px 10px;display:flex;flex-direction:column;gap:18px}
    .integrity-brand{display:flex;align-items:center;gap:8px;padding:4px 7px 10px;font-weight:650;letter-spacing:.02em}
    .brand-chip{font-size:10px;padding:3px 5px;border-radius:4px;background:var(--viz-accent);color:var(--viz-accent-text);letter-spacing:.08em}
    .integrity-nav{display:flex;flex-direction:column;gap:3px}
    .nav-btn{width:100%;border:0;background:transparent;color:var(--viz-text);text-align:left;padding:9px 10px;border-radius:7px;font-size:13px;cursor:pointer}
    .nav-btn:hover{background:var(--viz-accent-bg-subtle)}
    .nav-btn.active{background:var(--viz-accent-bg);color:var(--viz-accent);font-weight:600}
    .integrity-main{min-width:0;background:var(--viz-panel)}
    .integrity-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--viz-border);background:var(--viz-card)}
    .top-title{font-size:13px;color:var(--viz-muted)}
    .user-chip{display:flex;align-items:center;gap:8px;font-size:13px}.avatar{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--viz-accent-bg);color:var(--viz-accent);font-size:11px;font-weight:700}
    .page{padding:20px;min-height:590px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.page h1{font-size:22px;font-weight:650;margin:0 0 4px}.subtext{font-size:13px;color:var(--viz-muted);margin:0}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.metric-card{padding:13px;background:var(--viz-card);border:1px solid var(--viz-border);border-radius:10px}.metric-label{font-size:12px;color:var(--viz-muted);margin-bottom:7px}.viz-stat-value{font-size:25px}.metric-help{font-size:11px;color:var(--viz-muted);margin-top:5px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.section-card{border:1px solid var(--viz-border);border-radius:10px;background:var(--viz-card);padding:15px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-title h2{font-size:15px;font-weight:650;margin:0}.domain-label{font-size:11px;color:var(--viz-muted);margin-top:2px}.link-btn{border:0;background:transparent;color:var(--viz-accent);font-size:12px;cursor:pointer;padding:4px}.link-btn:hover{text-decoration:underline}
    .simple-list{display:flex;flex-direction:column}.simple-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 0;border-top:1px solid var(--viz-border);font-size:13px}.simple-row:first-child{border-top:0}.simple-row small{display:block;color:var(--viz-muted);margin-top:2px}.count{font-weight:650}
    .table-wrap{border:1px solid var(--viz-border);border-radius:10px;background:var(--viz-card);overflow-x:auto}.table-headbar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 13px;border-bottom:1px solid var(--viz-border)}.table-headbar h2{font-size:15px;font-weight:650;margin:0}.table-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--viz-border);background:var(--viz-panel);color:var(--viz-text);border-radius:7px;padding:7px 9px;font-size:12px;min-width:180px}.select{border:1px solid var(--viz-border);background:var(--viz-panel);color:var(--viz-text);border-radius:7px;padding:7px 28px 7px 9px;font-size:12px}
    table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--viz-muted);font-weight:600;padding:9px 12px;background:var(--viz-panel);white-space:nowrap}td{padding:10px 12px;border-top:1px solid var(--viz-border);vertical-align:middle}td.title-cell{min-width:220px}.secondary{display:block;color:var(--viz-muted);font-size:11px;margin-top:2px}.open-btn{border:1px solid var(--viz-border);background:var(--viz-card);color:var(--viz-accent);border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;white-space:nowrap}.open-btn:hover{background:var(--viz-accent-bg-subtle)}
    .risk{display:inline-flex;align-items:center;border:1px solid;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:650;white-space:nowrap}.risk-high{background:var(--high-bg);color:var(--high-text);border-color:var(--high-border)}.risk-moderate{background:var(--mod-bg);color:var(--mod-text);border-color:var(--mod-border)}.risk-low{background:var(--low-bg);color:var(--low-text);border-color:var(--low-border)}
    .queue-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}.tab-btn{border:1px solid var(--viz-border);background:var(--viz-card);color:var(--viz-text);border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer}.tab-btn.active{border-color:var(--viz-accent);color:var(--viz-accent);background:var(--viz-accent-bg)}
    .check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.check-tile{border:1px solid var(--viz-border);background:var(--viz-card);border-radius:9px;padding:13px;text-align:left;color:var(--viz-text);cursor:pointer}.check-tile:hover,.check-tile.active{border-color:var(--viz-accent)}.check-name{font-size:13px;font-weight:650;margin-bottom:5px}.check-meta{font-size:11px;color:var(--viz-muted)}
    .detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:15px}.back-btn{border:0;background:transparent;color:var(--viz-accent);padding:0 0 8px;font-size:12px;cursor:pointer}.detail-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.detail-title h1{margin:0}.detail-meta{font-size:12px;color:var(--viz-muted);margin-top:5px}.why-box{border:1px solid var(--viz-border);background:var(--viz-card);border-radius:10px;padding:14px;margin-bottom:14px}.why-box h2{font-size:14px;margin:0 0 7px}.why-text{font-size:13px;margin:0}.detail-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-section{border:1px solid var(--viz-border);background:var(--viz-card);border-radius:10px;padding:14px}.detail-section h2{font-size:15px;margin:0 0 10px}.finding{padding:10px 0;border-top:1px solid var(--viz-border)}.finding:first-of-type{border-top:0}.finding-top{display:flex;justify-content:space-between;gap:10px}.finding-name{font-size:13px;font-weight:600}.finding-evidence{font-size:12px;color:var(--viz-muted);margin-top:4px}.status-flag{color:var(--high-text);font-size:11px;font-weight:600}.status-clear{color:var(--low-text);font-size:11px;font-weight:600}.status-visible{color:var(--mod-text);font-size:11px;font-weight:600}
    .logic{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}.logic-box{border:1px solid var(--viz-border);border-radius:10px;background:var(--viz-card);padding:14px}.logic-box h3{font-size:14px;margin:0 0 6px}.logic-box p{font-size:12px;color:var(--viz-muted);margin:0}.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule-section{border:1px solid var(--viz-border);background:var(--viz-card);border-radius:10px;padding:14px}.rule-section h2{font-size:15px;margin:0 0 5px}.rule-note{font-size:12px;color:var(--viz-muted);margin-bottom:8px}.rule-row{padding:9px 0;border-top:1px solid var(--viz-border);font-size:12px}.rule-row:first-of-type{border-top:0}.rule-row strong{display:block;font-size:13px;margin-bottom:2px}.domain-pill{display:inline-flex;border:1px solid var(--viz-border);border-radius:999px;padding:2px 6px;font-size:10px;margin-left:5px;color:var(--viz-muted)}
    .empty{padding:28px;text-align:center;color:var(--viz-muted);font-size:13px}
    @media(max-width:760px){.integrity-app{margin:0}.integrity-shell{grid-template-columns:1fr;border-radius:0}.integrity-sidebar{border-right:0;border-bottom:1px solid var(--viz-border);gap:8px}.integrity-nav{flex-direction:row;overflow-x:auto}.nav-btn{white-space:nowrap;width:auto}.metrics{grid-template-columns:1fr 1fr}.two-col,.detail-columns,.rules-grid{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr 1fr}.logic{grid-template-columns:1fr}.page{padding:14px}.integrity-topbar{padding:11px 14px}}
    @media(max-width:480px){.metrics,.check-grid{grid-template-columns:1fr}.page-head,.detail-head{flex-direction:column}.user-chip span:last-child{display:none}}
  </style>
</head>
<body>
<div id='integrity-prototype' class='integrity-app'>
<div class='integrity-shell'>
<aside class='integrity-sidebar'>
<div class='integrity-brand'><span>INTEGRITY</span><span class='brand-chip'>CENTRAL</span></div>
<nav class='integrity-nav' aria-label='Product navigation'>
<button class='nav-btn' data-page='overview'>▦ &nbsp; Overview</button>
<button class='nav-btn' data-page='queue'>☷ &nbsp; Review Queue</button>
<button class='nav-btn' data-page='all'>□ &nbsp; All Submissions</button>
<button class='nav-btn' data-page='content'>◫ &nbsp; Content Checks</button>
<button class='nav-btn' data-page='authorship'>♧ &nbsp; Authorship Checks</button>
<button class='nav-btn' data-page='how'>? &nbsp; How It Works</button>
</nav>
</aside>
<div class='integrity-main'>
<header class='integrity-topbar'><div class='top-title'>ASCO Editor Triage</div><div class='user-chip'><span class='avatar'>KG</span><span>K. Grant</span></div></header>
<section id='page' class='page' aria-live='polite'></section>
</div>
</div>
<script>
const checks=[
{id:'prior',label:'Prior Retractions',domain:'authorship',group:'high',description:'Corresponding or co-author has a prior retraction on record.'},
{id:'tortured',label:'Tortured Phrases',domain:'content',group:'high',description:'Known paraphrase-evasion patterns detected in manuscript text.'},
{id:'llm',label:'LLM Response Trace',domain:'content',group:'high',description:'Residual AI-assistant response language detected in manuscript text.'},
{id:'templating',label:'Templating (Cross-Author)',domain:'content',group:'high',description:'High structural overlap with another submission from an unrelated author group.'},
{id:'volume',label:'Submission Volume',domain:'authorship',group:'corroborating',description:'Author submitted substantially more abstracts than the typical author.'},
{id:'affiliation',label:'Affiliation Relevance',domain:'authorship',group:'corroborating',description:'Listed affiliation does not clearly connect to the research area or directory.'},
{id:'email',label:'Email Validity',domain:'authorship',group:'corroborating',description:'Corresponding-author email domain has a suspicious validity signal.'},
{id:'authorCount',label:'Author Count Deviation',domain:'authorship',group:'corroborating',description:'Author list is unusually long or short relative to the field norm.'},
{id:'network',label:'Author Network',domain:'authorship',group:'corroborating',description:'Unusual author-network relationship detected.'}
];
const records=[
{id:'ASCO-10231',title:'Neoadjuvant Chemo in Stage III NSCLC',author:'R. Patel',findings:[]},
{id:'ASCO-10244',title:'Biomarkers for Immunotherapy Response',author:'L. Nguyen',findings:[{check:'affiliation',evidence:'1 co-author affiliation unrelated to oncology'},{check:'authorCount',evidence:'7 authors vs. field median of 4'}]},
{id:'ASCO-10267',title:'CAR-T Outcomes in Relapsed Myeloma',author:'S. Okafor',findings:[{check:'tortured',evidence:'Cancerous new growth used for malignant neoplasm 4 times'}]},
{id:'ASCO-10289',title:'Survival Analysis in Pancreatic Cancer',author:'M. Reyes',findings:[]},
{id:'ASCO-10301',title:'Novel PARP Inhibitor Combination Trial',author:'A. Kim',findings:[{check:'llm',evidence:'Abstract contains residual phrase As an AI language model'}]},
{id:'ASCO-10318',title:'Real-World Data on Breast Cancer Screening',author:'J. Novak',findings:[{check:'volume',evidence:'Corresponding author submitted 9 abstracts this cycle (average: 2)'}]},
{id:'ASCO-10327',title:'Genomic Profiling of Colorectal Tumors',author:'T. Adeyemi',findings:[{check:'email',evidence:'Domain registered 11 days before submission'},{check:'network',evidence:'3 co-authors share network with a retracted 2024 paper'}]},
{id:'ASCO-10340',title:'Quality of Life Post-Radiotherapy',author:'P. Sharma',findings:[]},
{id:'ASCO-10355',title:'Machine Learning for Tumor Segmentation',author:'D. Costa',findings:[{check:'prior',evidence:'Corresponding author has 1 retraction (2023, Journal of Onc. Reports)'}]},
{id:'ASCO-10362',title:'Meta-analysis of Adjuvant Therapies',author:'H. Zhou',findings:[{check:'templating',evidence:'83% sentence-structure overlap with ASCO-10371, different author group'}]},
{id:'ASCO-10371',title:'Rare Sarcoma Case Series',author:'V. Petrov',findings:[{check:'templating',evidence:'83% sentence-structure overlap with ASCO-10362, different author group'},{check:'volume',evidence:'Corresponding author submitted 6 abstracts this cycle (average: 2)'}]},
{id:'ASCO-10389',title:'Cost-Effectiveness of Early Screening',author:'F. Idris',findings:[{check:'affiliation',evidence:'Affiliation listed does not appear in institutional directory'}]}
];
const checkMap=Object.fromEntries(checks.map(c=>[c.id,c]));
function priority(record){if(record.findings.some(f=>checkMap[f.check].group==='high'))return 'High';const n=record.findings.filter(f=>checkMap[f.check].group==='corroborating').length;return n>=2?'Moderate':'Low'}
function why(record){const p=priority(record);if(p==='Low')return 'No significant flags';return record.findings.map(f=>checkMap[f.check].label).join(', ')}
function riskBadge(p){return `<span class='risk risk-${p.toLowerCase()}'>${p==='Low'?'Low · no action':p}</span>`}
function domainCount(domain){return records.filter(r=>r.findings.some(f=>checkMap[f.check].domain===domain)).length}
function findingCount(checkId){return records.filter(r=>r.findings.some(f=>f.check===checkId)).length}
const state={page:'overview',queueRisk:'High',search:'',allSearch:'',allPriority:'All',allDomain:'All',activeContent:'all',activeAuthor:'all',selected:'ASCO-10371',detailAll:false};
const page=document.getElementById('page');const root=document.getElementById('integrity-prototype');
function nav(){root.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
function metric(label,value,help){return `<div class='metric-card'><div class='metric-label'>${label}</div><div class='viz-stat-value'>${value}</div><div class='metric-help'>${help}</div></div>`}
function rowsTable(items,showStatus=true){if(!items.length)return `<div class='empty'>No submissions match this view.</div>`;return `<table><thead><tr><th>Priority</th><th>Submission</th><th>Corresponding author</th><th>Why flagged</th>${showStatus?'<th></th>':''}</tr></thead><tbody>${items.map(r=>`<tr><td>${riskBadge(priority(r))}</td><td class='title-cell'><strong>${r.title}</strong><span class='secondary'>${r.id}</span></td><td>${r.author}</td><td>${why(r)}</td>${showStatus?`<td><button class='open-btn' data-open='${r.id}'>Open</button></td>`:''}</tr>`).join('')}</tbody></table>`}
function renderOverview(){const high=records.filter(r=>priority(r)==='High').length,mod=records.filter(r=>priority(r)==='Moderate').length,review=high+mod;const next=records.filter(r=>priority(r)!=='Low').slice(0,5);page.innerHTML=`<div class='page-head'><div><h1>Editor Triage Overview</h1><p class='subtext'>Start here. See what requires editor judgement, then move into the review queue.</p></div></div><div class='metrics'>${metric('Total submissions',records.length,'Every abstract appears once')}${metric('Needs editor judgement',review,'Moderate + High')}${metric('High priority',high,'At least one high-confidence check')}${metric('Moderate priority',mod,'2+ corroborating checks')}</div><div class='two-col'><section class='section-card'><div class='section-title'><div><h2>Content integrity</h2><div class='domain-label'>${domainCount('content')} submissions have a content finding</div></div><button class='link-btn' data-page='content'>View checks →</button></div><div class='simple-list'>${checks.filter(c=>c.domain==='content').map(c=>`<div class='simple-row'><div>${c.label}<small>${c.group==='high'?'High-confidence check':'Corroborating check'}</small></div><div class='count'>${findingCount(c.id)}</div></div>`).join('')}</div></section><section class='section-card'><div class='section-title'><div><h2>Authorship integrity</h2><div class='domain-label'>${domainCount('authorship')} submissions have an authorship finding</div></div><button class='link-btn' data-page='authorship'>View checks →</button></div><div class='simple-list'>${checks.filter(c=>c.domain==='authorship').map(c=>`<div class='simple-row'><div>${c.label}<small>${c.group==='high'?'High-confidence check':'Corroborating check'}</small></div><div class='count'>${findingCount(c.id)}</div></div>`).join('')}</div></section></div><div class='table-wrap'><div class='table-headbar'><h2>Review next</h2><button class='link-btn' data-page='queue'>View full queue →</button></div>${rowsTable(next)}</div>`}
function renderQueue(){const q=state.search.toLowerCase();let items=records.filter(r=>priority(r)===state.queueRisk).filter(r=>(r.id+' '+r.title+' '+r.author+' '+why(r)).toLowerCase().includes(q));const counts={High:records.filter(r=>priority(r)==='High').length,Moderate:records.filter(r=>priority(r)==='Moderate').length,Low:records.filter(r=>priority(r)==='Low').length};page.innerHTML=`<div class='page-head'><div><h1>Review Queue</h1><p class='subtext'>The workbook's High, Moderate and Low queues in one simple product view.</p></div></div><div class='queue-tabs'>${['High','Moderate','Low'].map(p=>`<button class='tab-btn ${state.queueRisk===p?'active':''}' data-risk='${p}'>${p==='Low'?'Low · no action':p} (${counts[p]})</button>`).join('')}</div><div class='table-wrap'><div class='table-headbar'><h2>${state.queueRisk==='Low'?'Low priority submissions':'Submissions requiring '+(state.queueRisk==='High'?'editor review':'a quick look')}</h2><div class='table-actions'><input id='queueSearch' class='search' type='search' placeholder='Search submissions...' value='${state.search}'></div></div>${rowsTable(items)}</div>`}
function renderAll(){const q=state.allSearch.toLowerCase();let items=records.filter(r=>state.allPriority==='All'||priority(r)===state.allPriority).filter(r=>{if(state.allDomain==='All')return true;return r.findings.some(f=>checkMap[f.check].domain===state.allDomain)}).filter(r=>(r.id+' '+r.title+' '+r.author+' '+why(r)).toLowerCase().includes(q));page.innerHTML=`<div class='page-head'><div><h1>All Submissions</h1><p class='subtext'>The master list — the product equivalent of the All Abstracts sheet.</p></div></div><div class='table-wrap'><div class='table-headbar'><h2>${items.length} submissions</h2><div class='table-actions'><input id='allSearch' class='search' type='search' placeholder='Search ID, title or author...' value='${state.allSearch}'><select id='priorityFilter' class='select' aria-label='Priority filter'><option ${state.allPriority==='All'?'selected':''}>All</option><option ${state.allPriority==='High'?'selected':''}>High</option><option ${state.allPriority==='Moderate'?'selected':''}>Moderate</option><option ${state.allPriority==='Low'?'selected':''}>Low</option></select><select id='domainFilter' class='select' aria-label='Check type filter'><option value='All' ${state.allDomain==='All'?'selected':''}>All checks</option><option value='content' ${state.allDomain==='content'?'selected':''}>Content</option><option value='authorship' ${state.allDomain==='authorship'?'selected':''}>Authorship</option></select></div></div>${rowsTable(items)}</div>`}
function renderDomain(domain){const isContent=domain==='content';const domainChecks=checks.filter(c=>c.domain===domain);const active=isContent?state.activeContent:state.activeAuthor;let affected=records.filter(r=>r.findings.some(f=>checkMap[f.check].domain===domain));if(active!=='all')affected=records.filter(r=>r.findings.some(f=>f.check===active));page.innerHTML=`<div class='page-head'><div><h1>${isContent?'Content Integrity Checks':'Authorship Integrity Checks'}</h1><p class='subtext'>${isContent?'Checks that examine the submitted manuscript text and cross-submission content.':'Checks that examine authors, affiliations and authorship-related context.'}</p></div></div><div class='check-grid'><button class='check-tile ${active==='all'?'active':''}' data-check-filter='all' data-domain='${domain}'><div class='check-name'>All ${isContent?'content':'authorship'} findings</div><div class='check-meta'>${domainCount(domain)} submissions</div></button>${domainChecks.map(c=>`<button class='check-tile ${active===c.id?'active':''}' data-check-filter='${c.id}' data-domain='${domain}'><div class='check-name'>${c.label}</div><div class='check-meta'>${c.group==='high'?'High-confidence':'Corroborating'} · ${findingCount(c.id)} flagged</div></button>`).join('')}</div><div class='table-wrap'><div class='table-headbar'><h2>${active==='all'?'Affected submissions':checkMap[active].label}</h2></div>${rowsTable(affected)}</div>`}
function renderDetail(){const r=records.find(x=>x.id===state.selected)||records[0];const p=priority(r);const contentChecks=checks.filter(c=>c.domain==='content');const authorChecks=checks.filter(c=>c.domain==='authorship');function section(title,list){return `<section class='detail-section'><h2>${title}</h2>${list.map(c=>{const f=r.findings.find(x=>x.check===c.id);let status='Clear',cls='status-clear',evidence='No issue detected.';if(f){status=p==='Low'&&c.group==='corroborating'?'Visible · no action':'Flagged';cls=status==='Flagged'?'status-flag':'status-visible';evidence=f.evidence}if(!state.detailAll&&!f)return '';return `<div class='finding'><div class='finding-top'><div class='finding-name'>${c.label}</div><div class='${cls}'>${status}</div></div><div class='finding-evidence'>${evidence}</div></div>`}).join('')}<button id='showAllChecks' class='link-btn'>${state.detailAll?'Show flagged checks only':'View all checks'}</button></section>`}page.innerHTML=`<button class='back-btn' data-back='1'>← Back</button><div class='detail-head'><div><div class='detail-title'><h1>${r.title}</h1>${riskBadge(p)}</div><div class='detail-meta'>${r.id} &nbsp; · &nbsp; ${r.author}</div></div></div><section class='why-box'><h2>Why this submission is here</h2><p class='why-text'>${p==='High'?'At least one high-confidence check fired. Editor review is required before proceeding.':p==='Moderate'?'Two corroborating authorship checks fired together. A quick editor judgement is recommended.':'No action is required. A single corroborating signal may still be visible below for transparency.'}</p></section><div class='detail-columns'>${section('Content integrity',contentChecks)}${section('Authorship integrity',authorChecks)}</div>`}
function renderHow(){const high=checks.filter(c=>c.group==='high'),cor=checks.filter(c=>c.group==='corroborating');page.innerHTML=`<div class='page-head'><div><h1>How It Works</h1><p class='subtext'>A product version of the workbook guidance — simple enough for editors to understand without re-deriving the logic.</p></div></div><div class='logic'><div class='logic-box'><h3>${riskBadge('High')} High</h3><p>Any one high-confidence check is enough to require editor review.</p></div><div class='logic-box'><h3>${riskBadge('Moderate')} Moderate</h3><p>Two or more corroborating checks together are worth a quick editor look.</p></div><div class='logic-box'><h3>${riskBadge('Low')} Low</h3><p>No action needed. One corroborating check alone remains visible in detail but does not require review.</p></div></div><div class='rules-grid'><section class='rule-section'><h2>High-confidence checks</h2><div class='rule-note'>Any one fired → High priority</div>${high.map(c=>`<div class='rule-row'><strong>${c.label}<span class='domain-pill'>${c.domain==='content'?'Content':'Authorship'}</span></strong>${c.description}</div>`).join('')}</section><section class='rule-section'><h2>Corroborating checks</h2><div class='rule-note'>Two or more together → Moderate priority</div>${cor.map(c=>`<div class='rule-row'><strong>${c.label}<span class='domain-pill'>Authorship</span></strong>${c.description}</div>`).join('')}</section></div>`}
function render(){nav();if(state.page==='overview')renderOverview();else if(state.page==='queue')renderQueue();else if(state.page==='all')renderAll();else if(state.page==='content')renderDomain('content');else if(state.page==='authorship')renderDomain('authorship');else if(state.page==='detail')renderDetail();else renderHow();nav()}
root.addEventListener('click',e=>{const pg=e.target.closest('[data-page]');if(pg){state.page=pg.dataset.page;render();return}const rk=e.target.closest('[data-risk]');if(rk){state.queueRisk=rk.dataset.risk;render();return}const op=e.target.closest('[data-open]');if(op){state.selected=op.dataset.open;state.detailAll=false;state.page='detail';render();return}if(e.target.closest('[data-back]')){state.page='queue';render();return}const cf=e.target.closest('[data-check-filter]');if(cf){if(cf.dataset.domain==='content')state.activeContent=cf.dataset.checkFilter;else state.activeAuthor=cf.dataset.checkFilter;render();return}if(e.target.id==='showAllChecks'){state.detailAll=!state.detailAll;render()}});
root.addEventListener('input',e=>{if(e.target.id==='queueSearch'){state.search=e.target.value;renderQueue()}if(e.target.id==='allSearch'){state.allSearch=e.target.value;renderAll()}});
root.addEventListener('change',e=>{if(e.target.id==='priorityFilter'){state.allPriority=e.target.value;renderAll()}if(e.target.id==='domainFilter'){state.allDomain=e.target.value;renderAll()}});
render();
</script>
</div>
</body>
</html>
